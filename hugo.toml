baseurl      = "https://kkucherenkov.github.io/"
title        = "Kirill's homepage"
languageCode = "ru"
defaultContentLanguage = "ru"
theme        = "hello-friend-ng"

[pagination]
  pagerSize = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Subtitle for home
  homeSubtitle = "A backend/mobile fullstack developer"

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable sharing buttons, if you like
  enableSharingButtons = true
  
  # Show a global language switcher in the navigation bar
  enableGlobalLanguageMenu = true

  # Metadata mostly used in document's head
  description = "My new homepage and blog"
  keywords = "homepage, blog, CV"

  # Show reading time on posts
  EnableReadingTime = true

  # Extra stylesheet layered on top of the theme (see static/css/custom.css)
  customCSS = ["/css/custom.css"]

[taxonomies]
    tag = "tags"

# ru lives at the site root, en under /en/. Only projects are translated;
# the en menu points to the Russian blog with an absolute URL.
[languages]
  [languages.ru]
    weight = 1
    title = "Kirill's homepage"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [[languages.ru.menus.main]]
      identifier = "about"
      name       = "About"
      url        = "/about"
      weight     = 1
    [[languages.ru.menus.main]]
      identifier = "resume"
      name       = "CV"
      url        = "/resume"
      weight     = 2
    [[languages.ru.menus.main]]
      identifier = "projects"
      name       = "Projects"
      url        = "/projects"
      weight     = 3
    [[languages.ru.menus.main]]
      identifier = "blog"
      name       = "Blog"
      url        = "/posts"
      weight     = 4
    [[languages.ru.menus.main]]
      identifier = "tags"
      name       = "Tags"
      url        = "/tags"
      weight     = 5

  [languages.en]
    weight = 2
    languageCode = "en"
    title = "Kirill's homepage"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    [languages.en.params]
      homeSubtitle = "A backend/mobile fullstack developer"
    [[languages.en.menus.main]]
      identifier = "projects"
      name       = "Projects"
      url        = "/projects"
      weight     = 1
    [[languages.en.menus.main]]
      identifier = "blog"
      name       = "Blog (ru)"
      url        = "https://kkucherenkov.github.io/posts/"
      weight     = 2

# Social links shown on the home page (order = display order)
[[params.social]]
  name = "github"
  url  = "https://github.com/kkucherenkov"
  nonewpage = 0
[[params.social]]
  name = "linkedin"
  url  = "https://www.linkedin.com/in/kirillkucherenkov/"
  nonewpage = 0
[[params.social]]
  name = "telegram"
  url  = "https://t.me/kkucherenkov"
  nonewpage = 0
[[params.social]]
  name = "email"
  url  = "mailto:kirill.kucherenkov@gmail.com"
  nonewpage = 1
[[params.social]]
  name = "rss"
  url  = "/posts/index.xml"
  nonewpage = 1
